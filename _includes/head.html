<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | strip_html }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="keywords" content="{{ page.keywords | default: site.keywords }}">

  <!-- Link previews (Slack, X, LinkedIn…). Set `og_image` in index.md. -->
  <meta property="og:title" content="{{ page.title | default: site.title | strip_html }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.og_image %}
  <meta property="og:image" content="{{ page.og_image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  {% endif %}

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/static/css/bulma.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/static/css/academicons.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/static/css/fontawesome.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/static/css/bulma-carousel.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/static/css/index.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/static/images/favicon.svg' | relative_url }}">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script defer src="{{ '/static/js/fontawesome.all.min.js' | relative_url }}"></script>
  <script defer src="{{ '/static/js/bulma-carousel.min.js' | relative_url }}"></script>
  <script defer src="{{ '/static/js/index.js' | relative_url }}"></script>

  <!-- MathJax: write math as $$...$$ in Markdown (inline or display). -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true,
        tags: 'none'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
